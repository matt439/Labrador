<!doctype html>
<!--
  The development page for the minimal sample's browser build: Emscripten
  writes the module's script tag where SCRIPT is marked below, and the result
  is MinimalSample.html beside the .js and the .wasm. Serve that folder over
  HTTP, because a browser will not compile a module read from file://, and
  open it.

  The page contract is published at
  https://labradorengine.com/docs/guides/browser/#the-page-and-what-it-owes-the-module:
  Module.canvas is sized by CSS, focusable and with touch-action: none.
  This page supplies Module.onQuit and Module.onError; the optional graphics
  hooks are Module.onContextLost and Module.onContextRestored. Keep the canvas
  attached until the game quits. A file that fails to download is the page's
  own to report, because the engine never runs: the lines below Module do it.
  Escape asks before it quits, and a finger on the canvas shows a marker with
  the point's id.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labrador - minimal sample</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; outline: none; touch-action: none; }
  canvas:focus-visible { outline: 2px solid #5a9; }
  #status { margin: 10px 0 0; min-height: 1.4em; }
  #status.error { color: #f77; }
</style>
</head>
<body>
<main>
  <canvas id="canvas" tabindex="0" aria-label="Minimal sample"></canvas>
  <p id="status" role="status">Loading...</p>
</main>
<script>
  var canvas = document.getElementById("canvas");
  var statusLine = document.getElementById("status");

  canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

  var Module = {
    canvas: canvas,
    onRuntimeInitialized: function () {
      loading = false;
      statusLine.textContent =
        "Arrows, WASD or the left stick move the text, and a finger on it shows its id. Escape asks to quit; Enter says yes.";
      canvas.focus();
    },
    onQuit: function () {
      statusLine.textContent = "Quit. Reload the page to play again.";
    },
    onError: function (message) {
      statusLine.className = "error";
      statusLine.textContent = message;
    },
    onAbort: loadFailed,
  };

  // A download that fails never reaches the engine, so Module.onError cannot
  // report it. Emscripten's loader calls Module.onAbort when the .wasm cannot
  // be fetched or compiled; a preloaded .data file or the loader script
  // fails as a rejected promise or an error event instead. The console still
  // has the reason. This line is for the player, and only until the game has
  // started.
  var loading = true;
  function loadFailed() {
    if (!loading) { return; }
    loading = false;
    statusLine.className = "error";
    statusLine.textContent =
      "The game could not be loaded. Check your connection and reload the page.";
  }
  window.addEventListener("unhandledrejection", loadFailed);
  window.addEventListener("error", function (event) {
    // An uncaught exception arrives at the window, and a script that would
    // not download at its own tag. A missing image is neither.
    if (event.target === window || event.target.tagName === "SCRIPT") { loadFailed(); }
  }, true);
</script>
{{{ SCRIPT }}}
</body>
</html>
