# The acceptance target that does not yet pass reliably on hosted runners,
# run only on request (Actions > acceptance trial > Run workflow) so that
# pull requests and master show no failure that blocks nothing. SITE#5 owns
# making it reliable; once it passes repeatedly it moves back into
# website.yml, as NVDA's target did. See docs/website-versioning.md's
# "Browser acceptance suite".
#
# ios: Safari in the newest iOS Simulator. Its safaridriver cannot touch
# anything below the page's first screen (see touchAtPagePoint in
# website/acceptance/browsers.mjs), so the release index check fails there.

name: acceptance trial

on:
  workflow_dispatch:

jobs:
  acceptance-fixture:
    name: acceptance fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the fixture
        working-directory: website
        run: npm run acceptance:fixture -- "$RUNNER_TEMP/fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-fixture
          path: ${{ runner.temp }}/fixture/repo/website/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-fixture-logs
          path: ${{ runner.temp }}/fixture/logs
          retention-days: 7

  ios:
    name: acceptance (ios)
    needs: acceptance-fixture
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-fixture
          path: ${{ runner.temp }}/dist
      - run: sudo safaridriver --enable
      - name: Run the suite
        run: >-
          npm run acceptance -- --target ios
          --serve-dist "$RUNNER_TEMP/dist" --report "$RUNNER_TEMP/report/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report-ios
          path: ${{ runner.temp }}/report
          retention-days: 14
