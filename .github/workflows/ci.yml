# Configure, build and test on a clean checkout.
#
# ARCHITECTURE said ctest runs "on a contributor's machine or in CI" while
# there was no .github/ at all. This is the CI half made true.
#
# Everything this builds is in the repository or in vcpkg.json, so a run here
# is a real clone of what a new contributor gets. The step that used to launch
# the paint-shooter to prove a clone with no wave bank still starts went with
# it to its own repository; there is no game here to launch.

name: build and test

on:
  push:
    branches: [master, 'review-*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. A queue of stale runs on
# a repository with one maintainer is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The check's name is the preset alone. Without it GitHub names each
    # matrix job after every value in its entry, so changing skip_tests or
    # vulkan_sdk would rename a required check and leave every pull request
    # waiting on a context that never reports (CONTRIBUTING.md).
    name: windows (${{ matrix.preset }})
    runs-on: windows-latest
    # Bounded well above a cold vcpkg cache, so a stalled step fails the check
    # rather than holding every pull request for GitHub's six-hour default.
    timeout-minutes: 90

    # Every backend, because "they all pass the same tests" is a claim that
    # rots the moment nothing checks it - and a backend rots by failing to
    # compile long before it rots by drawing the wrong thing.
    #
    # THE GL PRESET SKIPS RenderPixelTests, AND THAT IS NOT A CONVENIENCE. A
    # runner has no GPU. Direct3D makes a device there anyway and OpenGL does
    # not: Windows' fallback for OpenGL is the GDI generic implementation,
    # which is version 1.1 and has no WGL_ARB_create_context, so create_device
    # throws saying so. The pixel contract is checked on a machine with a
    # driver; everything else about that backend is checked here.
    #
    # AND IT IS NOT THE WARP FALLBACK THAT MAKES THE DIRECT3D JOBS WORK, WHICH
    # THIS FILE SAID UNTIL ONE JOB LOG WAS READ. x64-release runs
    # RenderPixelTests here and passes - run 33144174541, 14 of 14, that entry
    # in 0.36s - and a release build has no WARP fallback at all:
    # engine/render/d3d11/device_resources.cpp puts it in the #else of
    # #if defined(NDEBUG) and throws "No Direct3D hardware device found"
    # instead. So this runner offers a DXGI adapter that GetHardwareAdapter
    # accepts - one without DXGI_ADAPTER_FLAG_SOFTWARE - and D3D11CreateDevice
    # succeeds on it. WHICH RASTERISER THAT IS, A LOG CANNOT SAY: the two lines
    # that would name it are OutputDebugString calls compiled only into _DEBUG
    # builds, and nothing in ctest's output carries an adapter description. The
    # checkable shape is what the matrix rests on and it is unchanged: Direct3D
    # gets a device on this machine, GL and Vulkan do not.
    #
    # THE D3D12 PRESET SKIPS NOTHING, AND THAT IS THE REASON IT IS THE FOURTH
    # BACKEND. Whatever adapter this runner offers, both Direct3D backends take
    # it, so this runner rasterises the whole pixel contract twice, against one
    # set of images, on one rasteriser - which is the cross-backend comparison
    # the golden set was added for and which the GL preset cannot supply here.
    # If the two ever disagree, this job is where it shows.
    #
    # THE VULKAN PRESET SKIPS RenderPixelTests FOR THE SAME REASON THE GL ONE
    # DOES, AND docs/port/android.md SAID SO BEFORE IT WAS WRITTEN: "it does not
    # buy a CI rasteriser for free". WARP is a Direct3D luxury. Vulkan's
    # software implementations - lavapipe, SwiftShader - are installed rather
    # than shipped, so a runner has a loader and no device, and
    # engine/render/vulkan/device_resources.cpp says exactly that when it finds
    # none. Everything else about the backend is checked here, which is the
    # point: a backend rots by failing to compile long before it rots by drawing
    # the wrong thing.
    #
    # IT IS ALSO THE ONE PRESET THAT INSTALLS SOMETHING, and that was decided
    # rather than discovered. Every other dependency in this repository is on
    # the runner already - fxc and the Direct3D libraries come with Visual
    # Studio, opengl32 with Windows - where this one needs the Vulkan SDK twice
    # over: for a dxc that can emit SPIR-V at build time
    # (cmake/compile_shaders.cmake says which dxc and why), and for the Vulkan
    # loader the same installer puts in System32, without which nine of the
    # eleven other test executables in this preset would not start at all -
    # every one that links the engine. MattMathTests and LineSweeperTests are
    # the two that do not.
    #
    # THE NULL PRESET IS THE ONE THIS MACHINE CAN RUN COMPLETELY, and it is here
    # for that rather than for coverage. It has no platform API at all - no
    # graphics API and, since the audio seam landed, no audio API either - so
    # nothing in it can fail for a reason outside the repository, and its own
    # tests assert which sprites a frame submitted, in what order, from which
    # texture, and which wave an object played, out of which bank, at which
    # levels. That second half is what a runner could never check before: a
    # GPU-less runner has no sound card either, and the module had only
    # DirectXTK behind it. RenderPixelTests is not built in that configuration,
    # which is why nothing is excluded by name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64-debug
            skip_tests: ''
            vulkan_sdk: false
          - preset: x64-release
            skip_tests: ''
            vulkan_sdk: false
          - preset: x64-debug-d3d12
            skip_tests: ''
            vulkan_sdk: false
          - preset: x64-debug-gl
            skip_tests: '-E RenderPixelTests'
            vulkan_sdk: false
          - preset: x64-debug-vulkan
            skip_tests: '-E RenderPixelTests'
            vulkan_sdk: true
          - preset: x64-debug-null
            skip_tests: ''
            vulkan_sdk: false

    # The presets use the Ninja generator, so every cmake step needs the MSVC
    # environment. vcvars64 is found through vswhere rather than a hardcoded
    # path, because the runner image's Visual Studio edition is not this
    # repository's business - and through vswhere rather than a third-party
    # action, because a build that can be done with the tools already on the
    # machine should not add a supply chain to do it.
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # CMakePresets.json reads $env{VCPKG_ROOT} for the toolchain file and
      # configuring fails without it. This is the same one-time step the README
      # asks a person to do.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # The manifest's dependencies are built at configure time, which is most
      # of this job's wall clock. Keyed on vcpkg.json, so a run that changes no
      # dependency reuses the last one's binaries.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Only for the preset that needs it, and it is the only install step in
      # this file. CMake's own FindVulkan reads VULKAN_SDK, which is what the
      # installer sets and what this hands on to the configure step.
      #
      # -PassThru IS WHAT MAKES THIS STEP ABLE TO FAIL. Without it Start-Process
      # returns nothing and the exit code goes nowhere, so a failed install was
      # a green step that exported VULKAN_SDK anyway - and the two things that
      # then failed, find_package(Vulkan) and compile_hlsl_to_spirv's
      # deliberately-named VULKAN_SDK error, both blamed a cause that was not
      # the cause. That is the opposite of what T6 asks those messages to do,
      # and it is worth the lines here to keep the first failure the true one.
      # The second check is the same argument one step further: the loader can
      # land without the dxc, and that failure surfaces at configure time in
      # cmake/compile_shaders.cmake with VULKAN_SDK named and nothing wrong
      # with VULKAN_SDK.
      - name: Install the Vulkan SDK
        if: matrix.vulkan_sdk
        # A download and an install that take a minute or two; the installer
        # can stall without exiting, and this is what turns that into a failure.
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($process.ExitCode -ne 0) {
            throw "The Vulkan SDK installer exited with $($process.ExitCode). Nothing after this step can work, and every message it would produce would name the wrong cause."
          }
          if (-not (Test-Path "C:\VulkanSDK\Bin\dxc.exe")) {
            throw "The Vulkan SDK installed without the dxc that cmake/compile_shaders.cmake looks for in `$VULKAN_SDK/Bin. There is no other one on this runner with a SPIR-V backend."
          }
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset ${{ matrix.preset }}

      # This includes cmake/check_engine_includes.cmake, so an engine file that
      # includes a game header fails here as well as locally.
      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }}

      # The benchmark is one of these targets. It asserts on complexity class
      # rather than wall-clock, so it is a real test on a shared runner where an
      # absolute timing would be noise.
      - name: Test
        run: |
          call "%VCVARS%"
          ctest --preset ${{ matrix.preset }} ${{ matrix.skip_tests }}

      # A failed golden comparison is the one failure here that cannot be read
      # from the log: it says which frame moved and by how much, but the thing a
      # reviewer has to do next is look at the picture. RenderPixelTests writes
      # every frame it rejected beside itself, so this carries them out of the
      # runner. Only on failure, because on a green run the directory is empty
      # and an empty artifact is a line in a log nobody reads.
      - name: Keep the frames a golden check rejected
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ matrix.preset }}
          path: out/build/${{ matrix.preset }}/tests/render/golden-actual/
          if-no-files-found: ignore

      # Reported, not gated, so the numbers are in the log where a throughput
      # change shows up as a diff between two runs rather than as nothing at
      # all. A shared runner's absolute timings are not comparable to a
      # developer machine's and are not meant to be.
      - name: Benchmark numbers
        run: out\build\${{ matrix.preset }}\bench\LabradorBench.exe

  # The browser build, configured, built and tested. It compiles gl/ against
  # WebGL2 (docs/port/web.md, M3), and most of its tests run under Node, which
  # has no WebGL, so what those check is the second compiler and the second
  # standard library: clang under -Werror with zero suppressions, libc++, a
  # 32-bit size_t, gl/'s GLES path compiling and linking, and LineSweeper's
  # rules replayed tick for tick on a second floating-point code generator.
  #
  # They run under Node, which ctest reaches through the emulator Emscripten's
  # toolchain sets, so the step is the same ctest call the job above makes.
  # RenderPixelTests, RenderContextLossTests and WebWindowTests are the
  # exceptions: they are pages, run in the runner's Chrome by
  # tests/render/web/run_page.mjs, and they have steps of their own below so
  # that a failure there names itself. So are the six sample pages, each
  # loaded and quit in the same Chrome, in a step of their own after them.
  #
  # EMSCRIPTEN IS INSTALLED BY ITS OWN SDK MANAGER, NOT BY AN ACTION, for the
  # reason vcvars64 is found through vswhere above: the tools to do it are
  # git and the SDK itself, and a build that can be done with those should not
  # add a supply chain to do it. The version is pinned because it is the one
  # this build was proven on, and a compiler that moves under a -Werror build
  # moves it from green to red with no commit to blame.
  wasm:
    name: wasm
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    env:
      EMSDK_VERSION: 6.0.12

    steps:
      - uses: actions/checkout@v4

      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-wasm-

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git C:\emsdk
          call C:\emsdk\emsdk.bat install %EMSDK_VERSION% || exit /b 1
          call C:\emsdk\emsdk.bat activate %EMSDK_VERSION% || exit /b 1

      # Ninja and cmake come with Visual Studio, so the MSVC environment is
      # still what puts them on the path, though nothing here compiles with
      # MSVC. emsdk_env sets EMSDK, which the preset reads for the toolchain
      # file exactly as the x64 presets read VCPKG_ROOT.
      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          cmake --preset wasm-release

      - name: Build
        id: build
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          cmake --build --preset wasm-release

      - name: Test
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          ctest --preset wasm-release -E "RenderPixelTests|RenderContextLossTests|WebWindowTests|PageTests"

      # THE PIXEL CONTRACT IN A BROWSER, as a step of its own so that a failure
      # here names itself rather than reading as the second compiler's.
      # run_page.mjs's last line names the renderer, -V is what puts it in the
      # log on a pass, and --no-tests=error is what stops a configure that found
      # no Chrome from passing this step by running nothing. A frame it rejects
      # is in golden-actual/ beside the page, where the job above looks for the
      # desktop's. The context-loss page runs here too, because it needs the
      # same browser, and so does RenderPixelTestsWithoutS3tc, which the -R
      # pattern matches: the pixel page again with the S3TC extension hidden,
      # holding gl/'s CPU decode of block-compressed textures to the same set.
      #
      # WHAT THE RUNNER'S CHROME DRAWS WITH IS SWIFTSHADER, and the log says so:
      # "ANGLE (Google, Vulkan 1.3.0 (SwiftShader Device (Subzero)
      # (0x0000C0DE)), SwiftShader driver)", in runs 38113425730, 38114109449
      # and 38121167763. Those three failed two text frames by 9 against an
      # allowance of 8, every channel of the miss in green: SwiftShader rounds
      # the font atlas's BC2 colours differently from the GPU the set was made
      # on. RenderPixelTests decodes that atlas itself now, and forced onto
      # SwiftShader on the desktop (--use-angle=swiftshader) Chrome writes all
      # sixty frames byte for byte. tests/render/golden_image.cpp has the
      # measurement, beside the allowance it is about.
      - name: Test the pixel contract in headless Chrome
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          ctest --preset wasm-release -R "RenderPixelTests|RenderContextLossTests" --no-tests=error -V

      # THE WEB WINDOW, DRIVEN: WebWindowTests is a page in the same Chrome,
      # which tests/app/web/window_input.mjs clicks, types into, resizes and
      # touches over the DevTools protocol, comparing what the window told its
      # owner after each step. A step of its own because a failure here is the
      # window's, not the pixel contract's. --no-tests=error for the reason the
      # step above gives.
      - name: Drive the web window in headless Chrome
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          ctest --preset wasm-release -R "WebWindowTests" --no-tests=error --output-on-failure

      # WHAT A BROWSER BUILD SHIPS, LOADED: each sample's built page, served
      # and played to its own way out, which no other step does. A content
      # path the module cannot find, a page that never hands it what it needs
      # or a console error on the way fails it here rather than on a live
      # site. --no-tests=error for the reason the step above gives.
      - name: Load and quit each sample's page in headless Chrome
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          ctest --preset wasm-release -R "PageTests" --no-tests=error --output-on-failure

      # WHAT A HOST SERVES: the build writes LineSweeper's bundle to
      # web-dist/linesweeper/ - the module, its example page, the notices for
      # what it links, and BUILD.json naming this commit and every file's size
      # raw and under Brotli - and this carries it out of the runner, after
      # every step above has passed against the same build. Deploying it is
      # the host's business, not this job's (docs/port/web.md, section 7).
      # A missing bundle is an error, because the build is meant to write it.
      - name: Keep LineSweeper's web bundle
        uses: actions/upload-artifact@v4
        with:
          name: linesweeper-web
          path: out/build/wasm-release/web-dist/linesweeper/
          if-no-files-found: error

      - name: Keep the frames a golden check rejected
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-wasm-release
          path: out/build/wasm-release/tests/render/golden-actual/
          if-no-files-found: ignore

      # THE SAME PRESET A SECOND TIME WITH BOTH NULL BACKENDS, because the
      # sources that assert drawing and playing are compiled only when the
      # backend is null: RenderTests' recording cases, SceneTests' fan-out and
      # cull, the particle-draw and local-multiplayer draw cases, the bench
      # beside them, and AudioTests' recording cases. The preset builds gl/ and
      # webaudio/, so without this clang would never see them, and the test
      # count would not say so - they leave executables that still exist. Two
      # cache variables on the command line and a binary directory of its own
      # is the whole cost; a second pair of presets would be two more names for
      # two configure flags.
      #
      # IT RUNS WHATEVER THE TEST STEPS ABOVE SAID, because it checks
      # different sources: a red pixel step that skipped it is a push on which
      # clang compiled none of them. The job still fails when any step does.
      # What it does need is the preset to have built, since a compiler error
      # there would only be reported twice.
      - name: Configure, build and test with the null backends
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          call "%VCVARS%"
          call C:\emsdk\emsdk_env.bat
          cmake --preset wasm-release -B out/build/wasm-release-null -DLABRADOR_RENDER_BACKEND=null -DLABRADOR_AUDIO_BACKEND=null || exit /b 1
          cmake --build out/build/wasm-release-null || exit /b 1
          ctest --test-dir out/build/wasm-release-null --output-on-failure

  # THE PROJECT GET STARTED TEACHES, BUILT AGAINST THIS CHANGE'S ENGINE. Every
  # job above builds Labrador as the top-level project, where CMAKE_SOURCE_DIR
  # is the engine's root, the tests' packages are in the manifest, and the
  # samples include from the engine's root. A consumer has none of that, so a
  # path spelt from CMAKE_SOURCE_DIR inside engine/ that resolves somewhere
  # else in a consumer, or a package the engine starts to need that the
  # derived vcpkg.json lacks, passes every job above and fails here. A swap
  # another include root happens to cover is not caught: LabradorEngine's own
  # include root and MattMath's are the same directory, so spelling the first
  # from CMAKE_SOURCE_DIR still builds as a consumer.
  #
  # tools/consumer_check/assemble.py does the page's steps 3 to 6 into the
  # page's own C:\dev\mygame, with step 2's engine copied from this checkout
  # rather than added as a submodule - a pull request's own tree, not a clone
  # of master - and its README is how a person runs the same thing. The
  # folder is short on purpose: the compiler stops at 260 characters, and the
  # object files of a build sit far below the project's root, which is why
  # Get Started's prerequisites page asks for a short folder. The steps after
  # it are the page's step 7 without running the game, which the minimal
  # sample has no way to quit by itself yet, and then the PROJECT_IS_TOP_LEVEL
  # guard in the root CMakeLists.txt: the engine's tests are not in a
  # consumer's ctest.
  #
  # IT FETCHES NOTHING FROM A CLIENT. The engine cannot reach a repository
  # that consumes it and should not learn how (docs/design/PHILOSOPHY.md,
  # The public face), so the consumer here is the public walkthrough, from
  # this tree, and what it downloads besides this repository is vcpkg's.
  consumer:
    name: consumer
    runs-on: windows-latest
    # The windows jobs' bound, for their reason: this job restores their vcpkg
    # cache and never saves one, so after a vcpkg.json change or an evicted
    # cache it builds the packages from source as they do.
    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # THE WINDOWS JOBS' CACHE, RESTORED AND NEVER SAVED. The consumer's
      # packages are the engine's less the two only its tests use, built for
      # the same triplet at the same baseline, so their binaries are already
      # in that cache. Saving under the same key from here could win the race
      # with those jobs and leave the key holding a set without doctest and
      # lodepng; on a miss this job builds from source and leaves the saving
      # to them.
      - name: Restore the windows jobs' vcpkg binaries
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Assemble the Get Started project
        run: python tools\consumer_check\assemble.py C:\dev\mygame

      - name: Configure
        working-directory: C:\dev\mygame
        run: |
          call "%VCVARS%"
          cmake --preset x64-debug

      - name: Build
        working-directory: C:\dev\mygame
        run: |
          call "%VCVARS%"
          cmake --build --preset x64-debug

      # The consumer's root never calls enable_testing(), so ctest at the top
      # of its build tree lists no tests whatever the engine does, and the
      # count alone cannot fail. What the guard keeps out are the engine's own
      # enable_testing() and add_test() calls, which would write a
      # CTestTestfile.cmake below external\labrador in that tree, so the step
      # also fails on a CTestTestfile.cmake anywhere in it. The guard's other
      # half, the engine's samples and tests left out, shows as the configure
      # step failing, because they ask for doctest and the consumer's manifest
      # does not name it.
      - name: Check the engine's tests are not the project's
        working-directory: C:\dev\mygame
        run: |
          call "%VCVARS%"
          ctest -N --test-dir out\build\x64-debug | findstr /B /C:"Total Tests: 0" || exit /b 1
          dir /s /b out\build\x64-debug\CTestTestfile.cmake 2>nul && (echo A CTestTestfile.cmake is in the build tree: the engine registered tests. & exit /b 1)
          exit /b 0
