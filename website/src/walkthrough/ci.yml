# Builds the game and runs its tests on every push and pull request, on a
# GitHub-hosted Windows runner. It goes in .github/workflows/ci.yml.
#
# An example to copy and own, not an action anybody maintains: when the
# project grows a preset, a dependency or a second platform, this file grows
# with it.
name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # Well above a build with nothing cached, so a stalled step fails the run
    # rather than holding it for GitHub's six-hour default.
    timeout-minutes: 90

    # The presets use the Ninja generator, so every cmake step runs in a
    # Command Prompt with the MSVC environment, as on your machine.
    defaults:
      run:
        shell: cmd

    steps:
      # The engine is a submodule, and a checkout without this has an empty
      # external/labrador. A private submodule needs a token as well.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakePresets.json reads VCPKG_ROOT for the toolchain file. The runner
      # has a vcpkg of its own, and this points at it.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # vcpkg builds the manifest's packages at configure time and keeps the
      # results in its binary cache, which is this folder. Keyed on vcpkg.json,
      # so a run that changes no dependency restores the last one's binaries
      # instead of building them again.
      - name: Cache vcpkg's binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # vcvars64.bat is what the x64 Native Tools Command Prompt runs: it puts
      # cl, cmake, ninja and the Windows SDK's fxc, which compiles the engine's
      # shader, on the path. vswhere finds it whichever edition the runner has.
      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset x64-debug

      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset x64-debug

      # The game's tests and nothing of the engine's: the rules test, and the
      # start-up check, which gets a Direct3D device on this runner.
      - name: Test
        run: |
          call "%VCVARS%"
          ctest --preset x64-debug
